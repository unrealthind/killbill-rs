[package]
name = "killbilld"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The killbill-rs daemon: watches USB events and powers off on an unauthorized change while armed."
publish = false

[lib]
name = "killbilld"
path = "src/lib.rs"

[[bin]]
name = "killbilld"
path = "src/main.rs"

[dependencies]
killbill-proto = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Syscalls (netlink uevent socket, poweroff, the AF_UNIX control socket) all go
# through `nix`'s safe wrappers, so `#![deny(unsafe_code)]` holds crate-wide with
# no local exception. Unix-only; the netlink/poweroff bits are further
# `#[cfg(target_os = "linux")]`-gated in the source with non-Linux stubs, and
# the `control`/`daemon` modules are `#[cfg(unix)]`.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# ---------------------------------------------------------------------------
# Packaging (Phase 3). Both backends are driven from this crate and bundle all
# three binaries. Static musl builds → no shared-library dependencies.
#
#   cargo build --release --target x86_64-unknown-linux-musl --workspace
#   cargo deb          -p killbilld --target x86_64-unknown-linux-musl --no-build
#   cargo generate-rpm -p killbilld --target x86_64-unknown-linux-musl
#
# Asset source paths under `target/release/` are auto-remapped to the
# `--target` directory by cargo-deb; cargo-generate-rpm needs the explicit
# path, so its assets name the musl triple directly.
# ---------------------------------------------------------------------------

[package.metadata.deb]
name = "killbill-rs"
maintainer = "unrealthind <unrealthind@users.noreply.github.com>"
copyright = "2026 unrealthind. Licensed GPL-3.0-or-later."
license-file = ["../LICENSE", "0"]
section = "admin"
priority = "optional"
# Static musl binary: no shared-library dependencies. systemd is required for
# the daemon to be useful (no other init is supported — charter §11).
depends = "systemd"
extended-description = """
Event-driven successor to the Python usbkill. A root daemon watches USB
add/remove events on the kernel netlink uevent socket and, when armed and an
unauthorized change occurs, powers the machine off so the LUKS disk re-locks.

Ships killbilld (the daemon), killbillctl (CLI) and killbill-tui (terminal UI).
Installed disarmed; arm it only after configuring a whitelist."""
# Binary paths under `target/release/` are auto-remapped to the `--target`
# directory by cargo-deb. Every other source path is resolved relative to this
# manifest's directory (`killbilld/`), same as `license-file` above — so
# repo-root files need `../`.
assets = [
    ["target/release/killbilld", "usr/bin/", "755"],
    ["target/release/killbillctl", "usr/bin/", "755"],
    ["target/release/killbill-tui", "usr/bin/", "755"],
    ["../config.example.toml", "usr/share/killbill-rs/config.example.toml", "644"],
    ["../packaging/systemd/killbilld.service", "usr/lib/systemd/system/killbilld.service", "644"],
    ["../packaging/systemd/killbilld.service.d/luks-destroy.conf.example", "usr/share/killbill-rs/killbilld.service.d/luks-destroy.conf.example", "644"],
    ["../packaging/man/killbilld.8", "usr/share/man/man8/", "644"],
    ["../packaging/man/killbillctl.1", "usr/share/man/man1/", "644"],
    ["../packaging/man/killbill-tui.1", "usr/share/man/man1/", "644"],
    ["../packaging/man/killbill.conf.5", "usr/share/man/man5/", "644"],
    ["../README.md", "usr/share/doc/killbill-rs/README.md", "644"],
    ["../CHANGELOG.md", "usr/share/doc/killbill-rs/CHANGELOG.md", "644"],
]
maintainer-scripts = "../packaging/deb/"

[package.metadata.generate-rpm]
name = "killbill-rs"
summary = "Event-driven USB-kill daemon (poweroff so a LUKS disk re-locks)"
license = "GPL-3.0-or-later"
# Static musl binary: skip the automatic ELF dependency scan.
auto-req = "no"
requires = { systemd = "*" }
# cargo-generate-rpm takes a string that is either script content or a path to
# a file; these are paths, resolved from the directory the command runs in (the
# repo root). RPM runs scriptlets under /bin/sh by default, matching the
# `#!/bin/sh` in each file.
post_install_script = "packaging/rpm/post.sh"
pre_uninstall_script = "packaging/rpm/preun.sh"
post_uninstall_script = "packaging/rpm/postun.sh"

[[package.metadata.generate-rpm.assets]]
source = "target/x86_64-unknown-linux-musl/release/killbilld"
dest = "/usr/bin/killbilld"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "target/x86_64-unknown-linux-musl/release/killbillctl"
dest = "/usr/bin/killbillctl"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "target/x86_64-unknown-linux-musl/release/killbill-tui"
dest = "/usr/bin/killbill-tui"
mode = "755"

[[package.metadata.generate-rpm.assets]]
source = "packaging/systemd/killbilld.service"
dest = "/usr/lib/systemd/system/killbilld.service"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "config.example.toml"
dest = "/usr/share/killbill-rs/config.example.toml"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/systemd/killbilld.service.d/luks-destroy.conf.example"
dest = "/usr/share/killbill-rs/killbilld.service.d/luks-destroy.conf.example"
mode = "644"

[[package.metadata.generate-rpm.assets]]
source = "packaging/man/killbilld.8"
dest = "/usr/share/man/man8/killbilld.8"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "packaging/man/killbillctl.1"
dest = "/usr/share/man/man1/killbillctl.1"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "packaging/man/killbill-tui.1"
dest = "/usr/share/man/man1/killbill-tui.1"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "packaging/man/killbill.conf.5"
dest = "/usr/share/man/man5/killbill.conf.5"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "README.md"
dest = "/usr/share/doc/killbill-rs/README.md"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "CHANGELOG.md"
dest = "/usr/share/doc/killbill-rs/CHANGELOG.md"
mode = "644"
doc = true

[[package.metadata.generate-rpm.assets]]
source = "LICENSE"
dest = "/usr/share/licenses/killbill-rs/LICENSE"
mode = "644"
doc = true
