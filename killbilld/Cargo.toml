[package]
name = "killbilld"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The killbill-rs daemon: watches USB events and powers off on an unauthorized change while armed."

[lib]
name = "killbilld"
path = "src/lib.rs"

[[bin]]
name = "killbilld"
path = "src/main.rs"

[dependencies]
killbill-proto = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

# The poweroff responder calls reboot(2) directly on Linux (invariant 6: no
# shelling out). Every other target gets a stub, so the crate still builds and
# unit-tests anywhere.
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
