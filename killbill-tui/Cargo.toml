[package]
name = "killbill-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Terminal UI client for the killbill-rs daemon."
publish = false

[[bin]]
name = "killbill-tui"
path = "src/main.rs"

[dependencies]
killbill-proto = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
ratatui = { workspace = true }

# The control socket is AF_UNIX / SOCK_SEQPACKET (charter §8); `nix` gives the
# safe wrappers for it, exactly as `killbillctl` uses them. Unix-only tool.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
