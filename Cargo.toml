[workspace]
resolver = "2"
members = ["killbill-proto", "killbilld", "killbillctl", "killbill-tui"]

# Packaging (Phase 3): the `.deb` / `.rpm` metadata lives in `killbilld/Cargo.toml`
# ([package.metadata.deb] and [package.metadata.generate-rpm]); the systemd unit,
# maintainer scripts, man pages and install script are under `packaging/`.

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV — the toolchain the release is cut with (rustc 1.98.1, 2026-09-01). CI
# has a job that builds on exactly this version so the claim stays honest.
rust-version = "1.98"
license = "GPL-3.0-or-later"
authors = ["unrealthind <unrealthind@users.noreply.github.com>"]
repository = "https://github.com/unrealthind/killbill-rs"
homepage = "https://github.com/unrealthind/killbill-rs"
readme = "README.md"
description = "Event-driven USB-kill daemon: powers the machine off on an unauthorized USB change while armed, so a LUKS disk re-locks."
keywords = ["security", "usb", "luks", "systemd", "anti-forensics"]
categories = ["command-line-utilities", "os::linux-apis"]

[workspace.dependencies]
killbill-proto = { path = "killbill-proto", version = "0.1.0" }

# Shared third-party versions. The daemon runs on `std::thread` + channels
# throughout (sensor, responders, control server) — no async runtime; see
# `PROJECT_CHARTER.md` §13.1. Only two pieces are platform-bound, both via `nix`
# on Linux: the poweroff syscall and the netlink uevent socket.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"

# Binary boundaries only (main.rs / killbillctl): anyhow for error context,
# clap for the CLI, tracing-subscriber + tracing-appender for the daemon's
# non-blocking log sink (the kill path must never park behind a log write).
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# `fmt` only — no `ansi` (journald needs no colour), no `env-filter` (no regex
# pulled into a root daemon). Level is set with `.with_max_level`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tracing-appender = "0.2"

# Phase 2 TUI only (`killbill-tui`). ratatui bundles crossterm and re-exports it
# as `ratatui::crossterm`, so the client pins one version, not two. The TUI is a
# pure protocol client — no async runtime, no daemon deps.
ratatui = "0.29"

# Unix-only. `reboot`: the poweroff syscall as a typed wrapper (invariant 6).
# `socket`: the AF_NETLINK/NETLINK_KOBJECT_UEVENT uevent socket (USB sensor) and
# the AF_UNIX/SOCK_SEQPACKET control socket — covers `setsockopt`/`SO_RCVTIMEO`,
# `NetlinkAddr`, `UnixAddr`, `listen`/`accept`/`connect`, `SO_PEERCRED`.
# `user`: `geteuid` (startup root check) and the `Uid`/`Gid` newtypes for the
# socket `chown` — pure getuid/setuid-family syscalls only. The NSS-backed
# lookups (`User::from_name`, `Group::from_name`) that can block on a slow name
# service are NOT used anywhere and must stay unused.
# `fs`: `umask` around the socket bind.
# Every syscall goes through nix's safe wrappers so `#![deny(unsafe_code)]`
# holds with no exception.
nix = { version = "0.29", features = ["reboot", "socket", "user", "fs"] }

# Termination-signal handling without hand-rolled `unsafe` sigaction. The
# handler thread checks `kill_in_flight()` and never disarms (invariant 5).
signal-hook = "0.3"

[profile.release]
# Strip symbols from the packaged binaries. Not a correctness knob.
strip = "symbols"
# NOT a size knob — do not switch to "abort". Responders run on independent
# threads and a panic in one (logger, luks-destroy) must unwind only that
# thread, never abort the process and take an in-flight poweroff with it
# (invariant 1). The panic-isolation test in `responder` only means something
# under unwind.
panic = "unwind"
