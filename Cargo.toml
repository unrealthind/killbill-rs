[workspace]
resolver = "2"
members = ["killbill-proto", "killbilld", "killbillctl"]

# Phase 2 adds "killbill-tui"; Phase 3 adds packaging. Neither exists yet.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
killbill-proto = { path = "killbill-proto" }

# Shared third-party versions. The async/netlink/socket stack (tokio, …) lands
# with the USB sensor and control server in steps 5–6; steps 1–4 stay sync and
# (bar the Linux poweroff syscall) platform-neutral.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tracing = "0.1"

# Linux-only, `reboot` feature only: the poweroff syscall as a typed wrapper,
# never a shelled-out command (invariant 6). The arm-time capability check
# reads `/proc/self/status` with `std` — no `nix` "user" feature (that also
# pulls NSS-backed lookups that can block). Pulled in only under
# `[target.'cfg(target_os = "linux")'.dependencies]`.
nix = { version = "0.29", features = ["reboot"] }

[profile.release]
# NOT a size knob — do not switch to "abort". Responders run on independent
# threads and a panic in one (logger, luks-destroy) must unwind only that
# thread, never abort the process and take an in-flight poweroff with it
# (invariant 1). The panic-isolation test in `responder` only means something
# under unwind.
panic = "unwind"
