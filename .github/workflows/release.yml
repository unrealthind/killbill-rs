name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  # NOTE: action refs are tags for readability — pin to full commit SHAs before
  # publishing (security review, sub-phase 12.2).
  build:
    name: build static binaries + packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Release-readiness gate
        run: sh packaging/scripts/check-release.sh

      - name: Toolchain + musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"
          sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build (static musl, release)
        run: cargo build --workspace --release --locked --target "$TARGET"

      - name: Test on the release build
        run: cargo test --workspace --release --locked --target "$TARGET"

      - name: cargo-deb / cargo-generate-rpm
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          cargo deb -p killbilld --no-build --target "$TARGET"
          cargo generate-rpm -p killbilld --target "$TARGET"

      - name: Stage artifacts
        id: stage
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          [ "$ver" = "$GITHUB_REF_NAME" ] && ver="${{ github.event.inputs.tag }}" && ver="${ver#v}"
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf \
            "dist/killbill-rs-${ver}-x86_64-linux-musl.tar.gz" \
            killbilld killbillctl killbill-tui
          cp target/"$TARGET"/debian/*.deb dist/
          cp target/"$TARGET"/generate-rpm/*.rpm dist/
          ( cd dist && sha256sum ./* > SHA256SUMS )
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Sign with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY secret not set" >&2; exit 1; }
          sudo apt-get install -y minisign
          printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key
          for f in dist/*; do
            case "$f" in *.minisig) continue ;; esac
            minisign -S -s minisign.key -m "$f" <<EOF
          $MINISIGN_PASSWORD
          EOF
          done
          shred -u minisign.key

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.stage.outputs.version }}
          path: dist/*

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: dist/*
          body: |
            killbill-rs ${{ steps.stage.outputs.version }}

            Verify downloads:

                minisign -Vm SHA256SUMS -P <published pubkey>
                sha256sum -c SHA256SUMS

            A fresh install is **enabled but disarmed**. See the README and CHANGELOG.
