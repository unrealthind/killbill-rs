name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  # Third-party actions are pinned to a full commit SHA (trailing comment = the
  # human-readable version). This job holds the minisign signing key and a
  # contents:write token; a mutable tag here is a supply-chain hole. Bump
  # deliberately.
  build:
    name: build static binaries + packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Release-readiness gate
        run: sh packaging/scripts/check-release.sh

      - name: Toolchain + musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"
          sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Build (static musl, release)
        run: cargo build --workspace --release --locked --target "$TARGET"

      - name: Test on the release build
        run: cargo test --workspace --release --locked --target "$TARGET"

      - name: cargo-deb / cargo-generate-rpm
        # Pin the packaging tools to an exact version — they run in the same job
        # as the signing key and control the .deb/.rpm payload contents. --locked
        # only honours each tool's own lockfile, not the version resolved here.
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
          cargo deb -p killbilld --no-build --target "$TARGET"
          cargo generate-rpm -p killbilld --target "$TARGET"

      - name: Stage artifacts
        id: stage
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          [ "$ver" = "$GITHUB_REF_NAME" ] && ver="${INPUT_TAG#v}"
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf \
            "dist/killbill-rs-${ver}-x86_64-linux-musl.tar.gz" \
            killbilld killbillctl killbill-tui
          cp target/"$TARGET"/debian/*.deb dist/
          cp target/"$TARGET"/generate-rpm/*.rpm dist/
          ( cd dist && sha256sum ./* > SHA256SUMS )
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Sign with minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          test -n "$MINISIGN_SECRET_KEY" || { echo "MINISIGN_SECRET_KEY secret not set" >&2; exit 1; }
          sudo apt-get install -y minisign
          ( umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > minisign.key )
          for f in dist/*; do
            case "$f" in *.minisig) continue ;; esac
            minisign -S -s minisign.key -m "$f" <<EOF
          $MINISIGN_PASSWORD
          EOF
          done
          shred -u minisign.key

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.stage.outputs.version }}
          path: dist/*

      - name: Draft GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          files: dist/*
          body: |
            killbill-rs ${{ steps.stage.outputs.version }}

            Verify downloads:

                minisign -Vm SHA256SUMS -P <published pubkey>
                sha256sum -c SHA256SUMS

            A fresh install is **enabled but disarmed**. See the README and CHANGELOG.
