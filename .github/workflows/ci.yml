name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Third-party actions are pinned to a full commit SHA (the trailing comment is
  # the human-readable version). A mutable tag would let an upstream retag or a
  # maintainer-account compromise run arbitrary code in CI. Bump deliberately.
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: packaging scriptlet sync
        run: sh packaging/scripts/check-sync.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@c3bbe7e4e3f7baeee1a3dd9aec0a3b2aded580fb # v2.1.1
        with:
          command: check advisories bans licenses sources

  msrv:
    name: builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(sed -n 's/^rust-version = "\([0-9.]*\)".*/\1/p' Cargo.toml | head -n1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "${{ steps.msrv.outputs.version }}" --profile minimal
      - run: cargo +${{ steps.msrv.outputs.version }} build --workspace --locked
