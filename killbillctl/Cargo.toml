[package]
name = "killbillctl"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line client for the killbill-rs daemon."
publish = false

[[bin]]
name = "killbillctl"
path = "src/main.rs"

[dependencies]
killbill-proto = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

# The control socket is AF_UNIX / SOCK_SEQPACKET (charter §8); `nix` gives the
# safe wrappers for it. `killbillctl` is a Unix tool.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
