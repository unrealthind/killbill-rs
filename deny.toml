# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check
#
# killbill-rs is a root-privileged security daemon. The dependency graph is
# deliberately small (std::thread + channels, no async runtime — charter §13.1)
# and every addition should be justified. This file is a gate, not a formality.

[advisories]
version = 2
yanked = "deny"
# Keep this list short and every entry explained. An entry here is a promise to
# revisit, not a way to make a warning disappear.
ignore = [
    # `paste` (proc-macro helper) is unmaintained upstream with no successor API
    # and no safe upgrade. It reaches us only as a compile-time transitive
    # dependency of `ratatui` (TUI only); it ships no runtime code in the
    # binaries. Re-evaluate whenever `ratatui` is bumped.
    "RUSTSEC-2024-0436",
]

[bans]
# Multiple versions of one crate bloat a static binary and widen the audit
# surface. A warning now; tighten to "deny" once the graph is deduplicated
# (today: hashbrown, syn, unicode-width, windows-sys — all via ratatui/clap).
multiple-versions = "warn"
# Deny crates.io wildcard version requirements, but allow the workspace's own
# path crates (killbill-proto), which carry no meaningful version req.
wildcards = "deny"
allow-wildcard-paths = true
# Crates we never want pulled in (a network stack, an async runtime):
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "tokio" },
    { name = "async-std" },
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "curl" },
]
# Not denied, but noted so a future reader does not rediscover it as an alarm:
# `mio` is linked into `killbill-tui` only, via `crossterm`, purely as a poll
# abstraction for terminal-input readiness. It opens no sockets, and it does not
# reach `killbilld`. Invariant 8 (no network) is intact.

[licenses]
version = 2
# Exactly the licenses present in the current dependency tree. A new dependency
# whose license is not here fails `cargo deny check` — add it deliberately, with
# a glance at what the crate is, rather than pre-broadening the list.
allow = [
    "GPL-3.0-or-later",              # this workspace
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
